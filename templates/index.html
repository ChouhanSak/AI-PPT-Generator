<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI PPT Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="card">
    <h1>AI PPT Generator</h1>
    <p class="subtitle">Type a title. Get a fully designed, ready-to-edit PowerPoint.</p>

    <form id="ppt-form">
      <label for="title">Presentation Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. The Future of Renewable Energy" required />

      <div class="row">
        <div class="field">
          <label for="num_slides">Content Slides</label>
          <input type="number" id="num_slides" name="num_slides" min="3" max="12" value="6" />
        </div>
        <div class="field">
          <label for="tone">Tone</label>
          <select id="tone" name="tone">
            <option value="confident and clear">Confident &amp; Clear</option>
            <option value="formal and academic">Formal &amp; Academic</option>
            <option value="casual and friendly">Casual &amp; Friendly</option>
            <option value="persuasive and energetic">Persuasive &amp; Energetic</option>
          </select>
        </div>
      </div>

      <label for="audience">Audience (optional)</label>
      <input type="text" id="audience" name="audience" placeholder="e.g. college students, investors, employees" />

      <button type="submit" id="generate-btn">Generate Presentation</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
